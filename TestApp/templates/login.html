{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - O'zbekchasiga!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <style>
        :root {
            --primary: #2563eb;
            --primary-foreground: #ffffff;
            --secondary: #3b82f6;
            --background: #ffffff;
            --foreground: #475569;
            --card: #f3f4f6;
            --card-foreground: #1f2937;
            --muted: #f3f4f6;
            --muted-foreground: #6b7280;
            --border: #e5e7eb;
            --input: #ffffff;
            --radius: 0.5rem;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, var(--card) 100%);
            min-height: 100vh;
            color: var(--foreground);
        }
        
        .auth-container {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }
        
        .login-card {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 1rem);
            box-shadow: 0 25px 60px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            max-width: 420px;
            width: 100%;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--background) 0%, var(--card) 100%);
            border-bottom: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
        }
        
        .brand-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: calc(var(--radius) + 0.5rem);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-foreground);
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }
        
        .form-control {
            background: var(--input);
            border: 2px solid var(--border);
            border-radius: calc(var(--radius) + 0.25rem);
            padding: 1rem 1.25rem;
            transition: all 0.3s ease;
            font-size: 1rem;
            color: var(--card-foreground);
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
            background: var(--input);
            color: var(--card-foreground);
        }
        
        .form-control::placeholder {
            color: var(--muted-foreground);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: calc(var(--radius) + 0.25rem);
            padding: 1rem;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            color: var(--primary-foreground);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            color: var(--primary-foreground);
        }
        
        .alert-danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: calc(var(--radius) + 0.25rem);
            color: #dc2626;
        }
        
        .form-label {
            color: var(--card-foreground);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .text-primary {
            color: var(--primary) !important;
        }
        
        .text-muted {
            color: var(--muted-foreground) !important;
        }
        
        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .auth-link:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex align-items-center auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <div class="login-card">
                    <div class="login-header">
                        <div class="brand-icon">
                            <i class="bi bi-mortarboard"></i>
                        </div>
                        <h2 class="fw-bold mb-2 text-primary">O'zbekchasiga</h2>
                        <p class="mb-0 text-muted">Hisobingizga kiring</p>
                    </div>
                    
                    <div class="p-4">
                                                
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person me-1"></i>
                                    Foydalanuvchi nomi
                                </label>
                                <input type="text" class="form-control" id="username" name="login" placeholder="Foydalanuvchi nomingizni kiriting" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock me-1"></i>
                                    Parol
                                </label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Parolingizni kiriting" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 fw-medium">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Kirish
                            </button>
                        </form>

                        {% if error %}
                        <p style="color:red;">{{error}}</p>
                        {% endif %}
                        
                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">
                                Hisobingiz yo'qmi? 
                                <a href="{% url 'TestApp:signin' %}" class="auth-link">
                                    Ro'yxatdan o'ting
                                </a>
                            </p>
                            <p class="text-muted mt-2 mb-0">
                                <a href="{% url 'TestApp:home' %}" class="auth-link">
                                    <i class="bi bi-arrow-left me-1"></i>
                                    Bosh sahifaga qaytish
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
