{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish - O'zbekchasiga!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="d-flex align-items-center auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <div class="login-card">
                    <div class="login-header">
                        <div class="brand-icon">
                            <i class="bi bi-mortarboard"></i>
                        </div>
                        <h2 class="fw-bold mb-2 text-primary">O'zbekchasiga</h2>
                        <p class="mb-0 text-muted">Hisobingizga kiring</p>
                    </div>
                    
                    <div class="p-4">
                                                
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person me-1"></i>
                                    Foydalanuvchi nomi
                                </label>
                                <input type="text" class="form-control" id="username" name="login" placeholder="Foydalanuvchi nomingizni kiriting" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock me-1"></i>
                                    Parol
                                </label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Parolingizni kiriting" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 fw-medium">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Kirish
                            </button>
                        </form>

                        {% if error %}
                        <p style="color:red;">{{error}}</p>
                        {% endif %}
                        
                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">
                                Hisobingiz yo'qmi? 
                                <a href="{% url 'TestApp:signin' %}" class="auth-link">
                                    Ro'yxatdan o'ting
                                </a>
                            </p>
                            <p class="text-muted mt-2 mb-0">
                                <a href="{% url 'TestApp:home' %}" class="auth-link">
                                    <i class="bi bi-arrow-left me-1"></i>
                                    Bosh sahifaga qaytish
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
