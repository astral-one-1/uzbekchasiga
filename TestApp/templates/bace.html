{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Test Platform{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <style>
        /* SEN BERGAN CSS SHU YERGA JOYLASHTIRILADI */
    </style>
</head>
<body>

<button class="mobile-nav-toggle" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="row g-0">
    
    <!-- Sidebar -->
    <div class="col-md-3 col-lg-2 sidebar" id="sidebar">
        <h4 class="brand-title text-center py-4">O'zbekchasiga</h4>

        <nav class="nav flex-column">
            <a class="nav-link" href="{% url 'TestApp:dashboard' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'TestApp:my_result' %}">Natijalar</a>
            <a class="nav-link" href="{% url 'TestApp:logout' %}">Chiqish</a>
        </nav>
    </div>

    <!-- Main -->
    <div class="col-md-9 col-lg-10 main-content">
        {% block content %}{% endblock %}
    </div>

</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("show");
    document.querySelector(".sidebar-overlay").classList.toggle("show");
}
</script>

</body>
</html>
